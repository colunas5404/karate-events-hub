name: Daily Scrape Events

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC diariamente
  workflow_dispatch:  # Permitir trigger manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run scraper
        run: npm run scrape
      
      - name: Validate data
        run: npm run validate
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Karate Events Bot"
          
          if git diff --quiet data/events.json; then
            echo "Sem mudanças nos dados"
          else
            git add data/events.json
            git commit -m "chore: update events data [skip ci]"
            git push
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          include_dot_files: true
