<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Federações — Karate Events Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        :root{
            --pri:#c0195a;--sec:#1a237e;--acc:#ff6f00;
            --bg:#f0f2f5;--card:#fff;--border:#e0e0e0;
            --text:#212121;--muted:#757575;
        }
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}

        header{background:linear-gradient(135deg,var(--sec),var(--pri));color:#fff;
            padding:.9rem 1rem;position:sticky;top:0;z-index:100;
            box-shadow:0 2px 12px rgba(0,0,0,.25);}
        .hdr{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;}
        .logo{display:flex;align-items:center;gap:.5rem;font-size:1.2rem;font-weight:800;}
        .logo i{color:var(--acc);}
        .back{padding:.4rem .9rem;background:rgba(255,255,255,.18);color:#fff;
            border:1px solid rgba(255,255,255,.3);border-radius:8px;
            text-decoration:none;font-size:.82rem;font-weight:600;
            display:flex;align-items:center;gap:.35rem;}

        .wrap{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 3rem;}

        .page-title{font-size:1.4rem;font-weight:800;color:var(--sec);margin-bottom:.35rem;}
        .page-sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem;}

        /* FILTRO RÁPIDO */
        .search-bar{background:var(--card);border-radius:12px;padding:.85rem 1rem;
            box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:1.25rem;
            display:flex;gap:.75rem;align-items:center;}
        .search-bar i{color:var(--muted);}
        .search-bar input{flex:1;border:none;font-size:.95rem;outline:none;background:transparent;}

        /* SECÇÃO / REGIÃO */
        .region{margin-bottom:2rem;}
        .region-title{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;
            letter-spacing:1px;margin-bottom:.75rem;padding-bottom:.4rem;
            border-bottom:2px solid var(--border);display:flex;align-items:center;gap:.5rem;}
        .region-title span{background:var(--sec);color:#fff;padding:.15rem .6rem;
            border-radius:12px;font-size:.68rem;}

        /* CARDS DE FEDERAÇÃO */
        .fed-grid{display:grid;gap:.75rem;grid-template-columns:1fr;}
        @media(min-width:580px){.fed-grid{grid-template-columns:1fr 1fr;}}
        @media(min-width:900px){.fed-grid{grid-template-columns:1fr 1fr 1fr;}}

        .fed-card{background:var(--card);border-radius:14px;padding:1.25rem;
            box-shadow:0 1px 6px rgba(0,0,0,.08);
            border-left:4px solid var(--pri);
            display:flex;flex-direction:column;gap:.6rem;
            transition:box-shadow .2s;}
        .fed-card:hover{box-shadow:0 4px 16px rgba(192,25,90,.15);}
        .fed-card.international{border-left-color:#7b1fa2;}
        .fed-card.europe{border-left-color:var(--sec);}

        .fed-header{display:flex;align-items:flex-start;gap:.75rem;}
        .fed-flag{font-size:2rem;line-height:1;flex-shrink:0;}
        .fed-name-wrap{}
        .fed-country{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
        .fed-name{font-size:.95rem;font-weight:800;color:var(--sec);line-height:1.3;}

        .fed-abbr{display:inline-block;background:var(--pri);color:#fff;
            padding:.15rem .55rem;border-radius:8px;font-size:.7rem;font-weight:800;
            margin-top:.25rem;}
        .fed-card.international .fed-abbr{background:#7b1fa2;}
        .fed-card.europe .fed-abbr{background:var(--sec);}

        .fed-links{display:flex;flex-direction:column;gap:.4rem;margin-top:.25rem;}
        .fed-link{display:flex;align-items:center;gap:.5rem;font-size:.82rem;
            color:var(--muted);text-decoration:none;padding:.3rem .5rem;
            border-radius:7px;transition:background .15s;}
        .fed-link:hover{background:var(--bg);color:var(--text);}
        .fed-link i{width:14px;text-align:center;color:var(--pri);flex-shrink:0;}
        .fed-card.international .fed-link i{color:#7b1fa2;}
        .fed-card.europe .fed-link i{color:var(--sec);}
        .fed-link span{word-break:break-all;}

        .fed-btn-row{display:flex;gap:.5rem;margin-top:.25rem;}
        .fed-btn{flex:1;padding:.55rem;border-radius:8px;font-weight:700;font-size:.78rem;
            text-decoration:none;text-align:center;display:flex;align-items:center;
            justify-content:center;gap:.3rem;border:none;cursor:pointer;}
        .fed-btn-p{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;}
        .fed-btn-s{background:var(--bg);color:var(--sec);border:1.5px solid var(--border);}
        .fed-card.international .fed-btn-p{background:linear-gradient(135deg,#7b1fa2,#c0195a);}
        .fed-card.europe .fed-btn-p{background:linear-gradient(135deg,var(--sec),#283593);}

        .fed-wkf{font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;}
        .fed-wkf i{color:#f59e0b;}

        .hidden{display:none!important;}

        footer{background:var(--sec);color:#fff;text-align:center;padding:1rem;font-size:.78rem;}
        footer a{color:rgba(255,255,255,.6);text-decoration:none;margin-left:.5rem;}
    </style>
</head>
<body>

<header>
    <div class="hdr">
        <div class="logo"><i class="fas fa-crown"></i> Karate Events</div>
        <a href="index.html" class="back"><i class="fas fa-arrow-left"></i> Calendário</a>
    </div>
</header>

<div class="wrap">
    <div class="page-title"><i class="fas fa-building"></i> Federações de Karaté</div>
    <div class="page-sub">Diretório de federações nacionais e internacionais com links oficiais e contactos públicos.</div>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="search" placeholder="Procurar federação ou país..." oninput="filterFeds()">
    </div>

    <!-- MUNDIAL -->
    <div class="region" id="region-mundial">
        <div class="region-title"><i class="fas fa-globe"></i> Mundial <span>2</span></div>
        <div class="fed-grid" id="grid-mundial"></div>
    </div>

    <!-- EUROPA -->
    <div class="region" id="region-europa">
        <div class="region-title"><i class="fas fa-star"></i> Europa — Continente <span>1</span></div>
        <div class="fed-grid" id="grid-europa"></div>
    </div>

    <!-- IBÉRICA -->
    <div class="region" id="region-iberica">
        <div class="region-title"><i class="fas fa-map-marker-alt"></i> Península Ibérica <span>2</span></div>
        <div class="fed-grid" id="grid-iberica"></div>
    </div>

    <!-- EUROPA OCIDENTAL -->
    <div class="region" id="region-ocidental">
        <div class="region-title"><i class="fas fa-map-marker-alt"></i> Europa Ocidental <span>5</span></div>
        <div class="fed-grid" id="grid-ocidental"></div>
    </div>

    <!-- EUROPA CENTRAL -->
    <div class="region" id="region-central">
        <div class="region-title"><i class="fas fa-map-marker-alt"></i> Europa Central <span>3</span></div>
        <div class="fed-grid" id="grid-central"></div>
    </div>

    <!-- EUROPA DO SUL -->
    <div class="region" id="region-sul">
        <div class="region-title"><i class="fas fa-map-marker-alt"></i> Europa do Sul <span>2</span></div>
        <div class="fed-grid" id="grid-sul"></div>
    </div>

</div>

<footer>
    🥋 <strong>Karate Events Hub</strong> — Diretório de Federações
    <a href="admin.html"><i class="fas fa-shield-alt"></i> Admin</a>
</footer>

<script>
const FEDS = [

    },
    {

        phone:'',

    // ── EUROPA
    {

    },

        website:'https://www.rfek.es',
        calendar:'https://www.rfek.es/calendario',
        email:'rfek@rfek.es',
        phone:'+34 91 547 07 46',
        wkf:true, note:''
    },
    // ── OCIDENTAL
    {
        region:'ocidental', type:'national', flag:'🇫🇷', country:'França',
        abbr:'FFKA', name:'Fédération Française de Karaté',
        website:'https://www.ffkarate.fr',
        calendar:'https://www.ffkarate.fr/calendrier',
        email:'contact@ffkarate.fr',
        phone:'+33 1 80 06 17 50',
        wkf:true, note:''
    },
    {
        region:'ocidental', type:'national', flag:'🇬🇧', country:'Reino Unido',
        abbr:'EK', name:'England Karate',
        website:'https://www.englandkarate.com',
        calendar:'https://www.englandkarate.com/events',
        email:'info@englandkarate.com',
        phone:'',
        wkf:true, note:''
    },
    {
        region:'ocidental', type:'national', flag:'🇮🇪', country:'Irlanda',
        abbr:'IKF', name:'Irish Karate Federation',

    },
    {
        region:'ocidental', type:'national', flag:'🇧🇪', country:'Bélgica',

        website:'https://www.vekaf.be',

        phone:'+31 343 499 300',

    },
    // ── CENTRAL
    {
        region:'central', type:'national', flag:'🇩🇪', country:'Alemanha',
        abbr:'DKV', name:'Deutscher Karate Verband',
        website:'https://www.dkv.de',
        calendar:'https://www.dkv.de/termine',
        email:'info@dkv.de',
        phone:'+49 89 544 23 70',
        wkf:true, note:''
    },
    {
        region:'central', type:'national', flag:'🇨🇭', country:'Suíça',

    {
        region:'central', type:'national', flag:'🇦🇹', country:'Áustria',

    // ── SUL
    {
        region:'sul', type:'national', flag:'🇮🇹', country:'Itália',
        abbr:'FIJLKAM', name:'Federazione Italiana Judo Lotta Karate Arti Marziali',
        website:'https://www.fijlkam.it',

        email:'karate@fijlkam.it',
        phone:'+39 06 368 581',
        wkf:true, note:''
    },
    {
        region:'sul', type:'national', flag:'🇬🇷', country:'Grécia',
        abbr:'HKF', name:'Hellenic Karate Federation',
        website:'https://www.karate.gr',
        calendar:'https://www.karate.gr/nea',
        email:'info@karate.gr',
        phone:'',
        wkf:true, note:''
    },
];

function buildCards(){
    const regions = {};
    FEDS.forEach(f=>{
        if(!regions[f.region]) regions[f.region]=[];
        regions[f.region].push(f);
    });

    Object.entries(regions).forEach(([region, feds])=>{
        const grid = document.getElementById(`grid-${region}`);
        if(!grid) return;
        feds.forEach(f=>{
            const card = document.createElement('div');
            card.className = `fed-card ${f.type}`;
            card.dataset.search = `${f.country} ${f.name} ${f.abbr} ${f.email}`.toLowerCase();
            card.innerHTML = `
                <div class="fed-header">
                    <div class="fed-flag">${f.flag}</div>
                    <div class="fed-name-wrap">
                        <div class="fed-country">${f.country}</div>
                        <div class="fed-name">${f.name}</div>
                        <div class="fed-abbr">${f.abbr}</div>
                    </div>
                </div>
                <div class="fed-links">
                    <a href="${f.website}" target="_blank" rel="noopener" class="fed-link">
                        <i class="fas fa-globe"></i><span>${f.website.replace('https://','')}</span>
                    </a>
                    <a href="${f.calendar}" target="_blank" rel="noopener" class="fed-link">
                        <i class="fas fa-calendar-alt"></i><span>Calendário oficial</span>
                    </a>
                    ${f.email?`<a href="mailto:${f.email}" class="fed-link">
                        <i class="fas fa-envelope"></i><span>${f.email}</span>
                    </a>`:''}
                    ${f.phone?`<div class="fed-link">
                        <i class="fas fa-phone"></i><span>${f.phone}</span>
                    </div>`:''}
                </div>
                ${f.note?`<div class="fed-wkf"><i class="fas fa-info-circle"></i>${f.note}</div>`:''}
                ${f.wkf?`<div class="fed-wkf"><i class="fas fa-star"></i>Membro WKF</div>`:''}
                <div class="fed-btn-row">
                    <a href="${f.website}" target="_blank" rel="noopener" class="fed-btn fed-btn-p">
                        <i class="fas fa-external-link-alt"></i> Site Oficial
                    </a>
                    <a href="${f.calendar}" target="_blank" rel="noopener" class="fed-btn fed-btn-s">
                        <i class="fas fa-calendar"></i> Calendário
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    });
}

function filterFeds(){
    const q = document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('.fed-card').forEach(card=>{
        card.classList.toggle('hidden', q && !card.dataset.search.includes(q));
    });
    // Esconder regiões vazias
    document.querySelectorAll('.region').forEach(region=>{
        const visible = [...region.querySelectorAll('.fed-card')].some(c=>!c.classList.contains('hidden'));
        region.classList.toggle('hidden', !visible);
    });
}

buildCards();
</script>
</body>
</html>
